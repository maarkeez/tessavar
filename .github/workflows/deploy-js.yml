# Deploy JS game to GitHub Pages
name: "🚀 Deploy JS"

on:
  push:
    branches: [ "main" ]
    # Skipped when a push only changes documentation or the telemetry collector, which has its own workflow, except the
    # dependency report, which is deployed. The last matching pattern wins, so the report is listed after the docs it is
    # excluded from
    paths:
      - "**"
      - "!docs/**"
      - "!GLOSSARY.md"
      - "!README.md"
      - "!telemetry-collector/**"
      - "docs/architecture/dependencies.html"
  workflow_dispatch:

env:
  JAVA_DISTRIBUTION: zulu
  JAVA_VERSION: 21

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  # Lists the run's artifacts, for deploy-pages and for the wait before it
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # One artifact per attempt, so a re-run does not find two artifacts with the same name
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    steps:
      - { uses: actions/checkout@v4 }
      - { name: Set up JDK, uses: actions/setup-java@v3, with: { distribution: "${{ env.JAVA_DISTRIBUTION }}", java-version: "${{ env.JAVA_VERSION }}" } }
      - { name: Prepare Gradle, uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 } # v3.1.0
      #- { name: Buid JS bundle, run: ./gradlew browserReleaseEsbuild }
      # The only build that sends product events, to the telemetry collector: see telemetry-collector/README.md
      - { name: Buid JS bundle, run: ./gradlew browserReleaseWebpack -Ptessavar.telemetryCollectorUrl=https://telemetry-collector.tessavar.workers.dev } # available after 6.0.0-beta3
      # Served at /storybook/: the same bundle, which starts the Storybook from that folder. The storybook skill runs the
      # same script, so what Claude screenshots is what is deployed
      - { name: Add Storybook, run: bash tools/storybook/add-storybook.sh }
      # Served at /dependencies/. Its links to the source files are relative to the repository, so they point to GitHub instead
      - name: Add dependency report
        run: |
          mkdir -p build/www/dependencies
          sed 's#"sourceRoot": "../../#"sourceRoot": "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/#' \
            docs/architecture/dependencies.html > build/www/dependencies/index.html
          grep -q '"sourceRoot": "https://' build/www/dependencies/index.html
      - { name: Upload artifact, uses: actions/upload-pages-artifact@v5.0.0, with: { path: 'build/www', name: "${{ env.PAGES_ARTIFACT }}" } }
      # An artifact uploaded in the same job can take a moment to be listed, and deploy-pages fails at once with
      # "No artifacts named ... were found" when it is not: see https://github.com/actions/deploy-pages/issues/451
      - name: Wait for the Pages artifact
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for attempt in $(seq 24); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$PAGES_ARTIFACT" --jq '.total_count' || echo 0)
            if [ "$count" -ge 1 ]; then echo "Artifact $PAGES_ARTIFACT is listed"; exit 0; fi
            echo "Artifact $PAGES_ARTIFACT not listed yet, waiting 5 s ($attempt/24)"
            sleep 5
          done
          echo "::error::Artifact $PAGES_ARTIFACT was not listed after 2 minutes"
          exit 1
      - { name: Deploy 🚀 to GitHub Pages, id: deployment, uses: actions/deploy-pages@v5.0.1, with: { artifact_name: "${{ env.PAGES_ARTIFACT }}" } }
