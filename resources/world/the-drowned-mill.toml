[[quests]]
id = "bats-over-the-water"
type = "SIDE"
questGiverNpcId = "elf"
repeatable = true
name = "Bats over the Water"
description = "Bats hunt over the drowned fields, and the Elf pays to keep them few."
lines = { start = "The bats grow bold over the water since the mill drowned. Two less of them, and my arrows can rest.", reminder = "Two bats, travellers. They hunt over the lake and the stream.", startAgain = "They always come back to the water. Two more, if you would: same task, same gold." }

[[quests.tasks]]
type = "DEFEAT"
unitId = "bat"
requiredDefeats = 2
text = "Defeat 2 Bats"

[quests.reward]
gold = 25

[[quests]]
id = "the-drowned-mill"
type = "MAIN"
startTiles = [[2, 2], [2, 3]]
name = "The Drowned Mill"
description = "Goats broke the dam above the mill, and the water took the fields. The Princess wants the mill turning again."

[[quests.tasks]]
type = "TALK"
npcId = "princess"
text = "Talk to the Princess"
line = "Three goats butted the dam until it broke, and now they roam the drowned fields. Drive them off, then follow the stream down to see where the water goes."

[[quests.tasks]]
type = "DEFEAT"
unitId = "goat"
requiredDefeats = 3
text = "Defeat 3 Goats"

[[quests.tasks]]
type = "VISIT"
tiles = [[18, 7], [18, 8], [18, 9]]
text = "Follow the stream down"

[quests.reward]
gold = 150
lootableItemIds = ["mana-elixir"]
